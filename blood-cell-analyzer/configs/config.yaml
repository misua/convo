# Configuration for Blood Cell Analyzer

# Paths
paths:
  data_root: "./data"
  bccd_path: "./data/bccd"
  kaggle_path: "./data/kaggle"
  models_path: "./models"
  samples_path: "./data/samples"

# Detection Model (YOLOv11n trained on BCCD)
detection:
  model: "bccd_yolo11n/weights/best.pt"  # YOLOv11n trained on BCCD (92.8% mAP50)
  fallback_model: "bccd_v1/weights/best.pt"  # YOLOv8n fallback
  image_size: 640
  batch_size: 16  # Safe for 12GB VRAM
  epochs: 50
  confidence_threshold: 0.5
  iou_threshold: 0.5
  classes:
    - "RBC"
    - "WBC"
    - "Platelets"

# Segmentation Model (NEW - YOLOv11n-seg for precise cell masks)
segmentation:
  enabled: true
  model: "bccd_seg_v1/weights/best.pt"  # YOLOv11n-seg (98.2% RBC mask mAP50)
  fallback_to_detection: true  # Use detection model if seg not available
  use_for_shape_analysis: true  # Use masks for accurate shape metrics
  classes:
    - "RBC"
    - "WBC"
    - "Platelets"

# WBC Classification Model (ResNet34 via FastAI)
classification:
classification:
  model: "efficientnet_b0"
  image_size: 224
  batch_size: 32
  epochs: 20
  learning_rate: 0.001
  classes:
    - "BASOPHIL"
    - "EOSINOPHIL"
    - "LYMPHOCYTE"
    - "MONOCYTE"
    - "NEUTROPHIL"

# RBC Shape Classification (NEW)
shape_classification:
  enabled: true
  model: "efficientnet_v2_s"  # EfficientNet-V2-Small
  image_size: 128  # Smaller crops for individual cells
  batch_size: 64
  epochs: 30
  learning_rate: 0.0001
  classes:
    - "normal"      # Biconcave disc
    - "microcyte"   # Small but normal shape
    - "target"      # Bull's-eye pattern (codocyte) - thalassemia indicator
    - "teardrop"    # Dacrocyte - thalassemia indicator
    - "spherocyte"  # Sphere (hereditary spherocytosis)
    - "irregular"   # Catch-all for other abnormalities
  # Shape metric thresholds
  metrics:
    circularity_normal_min: 0.85
    circularity_abnormal_threshold: 0.70
    elongation_normal_max: 1.3
    elongation_abnormal_threshold: 1.5
    solidity_normal_min: 0.95
    solidity_abnormal_threshold: 0.90

# Morphology Analysis
morphology:
  # Default microscope calibration (40x objective, typical)
  um_per_pixel: 0.25
  # RBC reference values
  rbc_normal_diameter_um: [6.2, 8.2]  # min, max
  # Hypochromia threshold
  central_pallor_ratio: 0.33
  # RDW reference
  rdw_normal_percent: [11.5, 14.5]

# Risk Scoring Weights (Updated for shape analysis)
risk_scoring:
  # New weights with shape analysis
  shape_abnormality_weight: 0.35  # NEW: target cells, teardrops
  microcytic_weight: 0.30  # Was 0.4
  hypochromic_weight: 0.25  # Was 0.4
  rdw_weight: 0.10  # Was 0.2
  # Shape-specific weights within abnormality score
  shape_weights:
    target: 3.0      # Strong thalassemia indicator
    teardrop: 2.5    # Strong thalassemia indicator
    microcyte: 1.5   # Moderate indicator
    spherocyte: 1.0  # Different condition
    irregular: 1.0   # Non-specific
  thresholds:
    low: 0.3
    medium: 0.6
    # high: > 0.6

# Plain Language Diagnosis
diagnosis:
  enabled: true
  # Traffic light thresholds
  traffic_light:
    green_max: 0.3   # Low risk
    yellow_max: 0.6  # Medium risk
    # red: > 0.6     # High risk

# Dashboard
dashboard:
  host: "127.0.0.1"
  port: 7860
  share: false
# Grad-CAM Explainability (Model Attention Visualization)
gradcam:
  enabled: false  # Disabled by default for performance
  colormap: "jet"  # Options: jet, turbo, viridis, inferno
  alpha: 0.4  # Overlay transparency [0.0-1.0]
  quality_threshold: 0.3  # Warn if attention outside bbox > threshold
  save_individual: false  # Save per-cell heatmaps to disk
  target_layers:
    detection: "model.model.22"  # YOLO11 last C2f block
    classification: "0.7"  # FastAI ResNet: model[0][7] (layer4)